server:
  address: ${SPRING_GATEWAY_HOST:127.0.0.1}
  port: ${SPRING_GATEWAY_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
spring:
  application:
    name: construction-rag-gateway
gateway:
  ai-base-url: ${AI_INTERNAL_BASE_URL:http://ai-module-api:8000}
  ai-token: ${AI_MODULE_TOKEN:}
  public-token: ${GATEWAY_PUBLIC_TOKEN:}
  timeout-ms: ${GATEWAY_TIMEOUT_MS:30000}
  jwt-issuer: ${GATEWAY_JWT_ISSUER:}
  jwt-jwk-set-uri: ${GATEWAY_JWT_JWK_SET_URI:}
  jwt-audience: ${GATEWAY_JWT_AUDIENCE:}
logging:
  pattern:
    console: '{"ts":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%level","logger":"%logger","msg":"%replace(%msg){''(?i)(bearer )[^ ]+'',''$1[REDACTED]''}"}%n'

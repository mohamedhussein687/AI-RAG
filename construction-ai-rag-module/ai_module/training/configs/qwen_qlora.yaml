base_model: Qwen/Qwen2.5-7B-Instruct
max_seq_length: 2048
epochs: 2
learning_rate: 0.0002
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
fp16: false
bf16: true
use_4bit: true
seed: 42
warmup_ratio: 0.03
logging_steps: 10
save_steps: 100
merge_adapter: false

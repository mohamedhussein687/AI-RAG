[project]
name = "construction-ai-rag-module"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "uvicorn>=0.30",
  "SQLAlchemy>=2.0",
  "asyncpg>=0.29",
  "aiomysql>=0.2",
  "alembic>=1.13",
  "qdrant-client==1.12.1",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-httpx>=0.30", "respx>=0.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*", "ingestion_worker*"]
